[project]
name = "lingua-orchestrator"
version = "0.1.0"
description = "Lingua FastAPI + LangGraph backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "redis[hiredis]>=5.2.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.50",
    "sse-starlette>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "fakeredis>=2.26.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lingua"]
