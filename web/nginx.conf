server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- API → orchestrator ---
  location /api/ {
    proxy_pass http://orchestrator:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE needs:
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding off;
    proxy_set_header Connection "";
  }

  # --- Preview iframe → Vite dev server in workspace ---
  # Vite is configured with base=/preview/ so it expects the full /preview/* path.
  # NO rewrite: pass the URI through unchanged.
  # CRITICAL: Host header must include the port (use $http_host, not $host),
  # otherwise Vite emits absolute redirects to http://localhost/preview/ (port 80).
  location /preview/ {
    proxy_pass http://workspace:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # WebSocket upgrade for Vite HMR
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location = /preview {
    return 301 $scheme://$http_host/preview/;
  }

  # Hashed assets — safe to cache forever (filename changes when content changes)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA shell — never cache the HTML, so deploys take effect immediately
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # --- React SPA fallback ---
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
