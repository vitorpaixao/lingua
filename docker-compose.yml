services:
  workspace:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: lingua-workspace
    ports:
      - "3000:3000"
      - "4096:4096"
    volumes:
      - project-data:/project
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped

volumes:
  project-data:
    name: lingua-project-data
